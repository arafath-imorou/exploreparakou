<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive | Explore Parakou</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <!-- Performance & Instant Navigation -->
    <link rel="dns-prefetch" href="https://ampktfwcpopkomrsckjm.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script type="speculationrules">
    {
        "prerender": [
            {
                "source": "list",
                "urls": ["index.html", "histoire.html", "tourisme.html", "culture.html", "talents.html", "agenda.html", "investir.html", "medias.html", "contact.html", "carte.html"],
                "eagerness": "moderate"
            }
        ]
    }
    </script>
</head>

<body>
    <header class="header" style="background:var(--color-primary); padding:10px 0;">
        <div class="container header-container">
            <a href="index.html" class="logo"><img decoding="async" src="assets/images/logo.webp" alt="Explore Parakou"></a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="histoire.html">Histoire</a></li>
                    <li><a href="tourisme.html">Tourisme</a></li>
                    <li><a href="culture.html">Culture</a></li>
                    <li><a href="talents.html">Talents</a></li>
                    <li><a href="agenda.html">Agenda</a></li>
                    <li><a href="investir.html">Investir</a></li>
                    <li><a href="medias.html">Médias</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="index.html" class="btn btn-outline" style="border:1px solid rgba(255,255,255,0.2);">Retour</a>
                <button class="mobile-menu-toggle" aria-label="Menu">
                    <i class="ph ph-list"></i>
                </button>
            </div>
        </div>
    </header>

    <main style="height: calc(100vh - 60px); position: relative; overflow: hidden; margin-top: 60px;">
        <!-- Map Container -->
        <div id="map" style="width: 100%; height: 100%; z-index: 1;"></div>

        <!-- Floating Search Bar -->
        <div class="map-search-container">
            <div class="search-input-wrapper">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="map-search" placeholder="Rechercher un lieu, un hôtel...">
            </div>
        </div>

        <!-- Floating Filters -->
        <div class="map-filters-container">
            <div class="filter-scroll">
                <button class="filter-chip active" data-category="all">
                    <i class="ph ph-squares-four"></i> Tout
                </button>
                <button class="filter-chip" data-category="tourisme">
                    <i class="ph ph-bank"></i> Tourisme
                </button>
                <button class="filter-chip" data-category="hebergement">
                    <i class="ph ph-bed"></i> Hôtels
                </button>
                <button class="filter-chip" data-category="restaurant">
                    <i class="ph ph-fork-knife"></i> Restos
                </button>
                <button class="filter-chip" data-category="loisirs">
                    <i class="ph ph-confetti"></i> Loisirs
                </button>
                <button class="filter-chip" data-category="commerce">
                    <i class="ph ph-shopping-bag"></i> Shopping
                </button>
            </div>
        </div>

        <!-- FAB Around Me -->
        <button class="fab-location" id="btn-locate-me" title="Autour de moi">
            <i class="ph ph-navigation-arrow"></i>
        </button>

        <!-- Bottom Sheet (Place Details) -->
        <div class="bottom-sheet" id="place-sheet">
            <div class="sheet-drag-handle"></div>
            <button class="sheet-close" id="sheet-close"><i class="ph ph-x"></i></button>

            <div class="sheet-content">
                <!-- Content injected via JS -->
                <div class="sheet-placeholder">
                    <p>Sélectionnez un lieu sur la carte pour voir les détails.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script src="assets/js/script.js"></script>
    <script src="assets/js/map.js"></script>

    <!-- Supabase Configuration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabaseClient.js"></script>
</body>

</html>
